version: 2

updates:
  # pnpm workspace: only configure the repository root so lockfile updates stay consistent.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    ignore:
      # tsup dts build needs the TS JS compiler API, removed in TS 7
      - dependency-name: typescript
        versions: ['>=7']
      # eve-ship-tree peer range is ^12
      - dependency-name: motion
        versions: ['>=13']
      # match node runtime in .nvmrc
      - dependency-name: '@types/node'
        versions: ['>=25']
    groups:
      changesets:
        patterns:
          - '@changesets/*'
      rollup:
        patterns:
          - '@rollup/*'
          - rollup
          - rollup-*
      storybook:
        patterns:
          - '@storybook/*'
          - storybook
      testing-library:
        patterns:
          - '@testing-library/*'
      types:
        patterns:
          - '@types/*'
      use-gesture:
        patterns:
          - '@use-gesture/*'
      vitejs:
        patterns:
          - '@vitejs/*'
      npm-unscoped:
        patterns:
          - '*'
        exclude-patterns:
          - '@*/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - actions/*
      pnpm:
        patterns:
          - pnpm/*
